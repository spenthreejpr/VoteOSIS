<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pemilihan Ketua OSIS SMP Negeri 3 Jayapura 2026/2027</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 100vh;
      min-height: 100dvh;
    }

    .dashboard-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: clamp(16px, 3vh, 36px) 20px 36px;
      gap: clamp(24px, 4.5vh, 48px);
    }

    .hero-card {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(8px);
      border: 4px solid var(--navy-primary);
      border-radius: 28px;
      padding: clamp(24px, 4vh, 46px) clamp(20px, 4vw, 56px);
      box-shadow: var(--shadow-lg);
      text-align: center;
      width: 100%;
      max-width: 920px;
      position: relative;
    }

    .hero-logos {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(24px, 6vw, 72px);
      margin-bottom: clamp(16px, 2.8vh, 28px);
    }

    .hero-logo-item {
      width: clamp(86px, 11vw, 145px);
      height: clamp(86px, 11vw, 145px);
      background: var(--white);
      border-radius: 24px;
      padding: 10px;
      border: 3px solid var(--bg-yellow-dark);
      box-shadow: 0 8px 20px rgba(19, 56, 143, 0.14);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hero-logo-item img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .hero-title {
      font-family: 'Montserrat', sans-serif;
      font-weight: 900;
      font-size: clamp(1.35rem, 2.8vw, 2.75rem);
      line-height: 1.25;
      color: var(--navy-primary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .hero-badge {
      display: inline-block;
      margin-top: 14px;
      background: var(--bg-yellow);
      color: var(--navy-dark);
      font-weight: 800;
      font-size: clamp(0.85rem, 1.2vw, 1.15rem);
      padding: 6px 22px;
      border-radius: 999px;
      border: 2px solid var(--navy-primary);
    }

    /* 2 Tombol Aksi Atas & Bawah */
    .action-stack {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 580px;
      gap: clamp(16px, 2.5vh, 24px);
    }

    .action-stack .btn-action {
      width: 100%;
      padding: clamp(18px, 2.6vh, 26px) 28px;
      font-size: clamp(1.05rem, 1.6vw, 1.45rem);
      letter-spacing: 0.5px;
      border-radius: 22px;
    }

    .btn-icon {
      width: clamp(26px, 2.2vw, 34px);
      height: clamp(26px, 2.2vw, 34px);
      flex-shrink: 0;
    }
  </style>
</head>
<body class="desktop-full-ratio">
  <div class="poster-wave-top"></div>

  <main class="dashboard-main">
    <section class="hero-card">
      <div class="hero-logos">
        <div class="hero-logo-item">
          <img id="logoLeft" src="https://i.imgur.com/6ym4GnU.png" alt="Logo OSIS">
        </div>
        <div class="hero-logo-item">
          <img id="logoRight" src="https://i.imgur.com/fpeCGav.png" alt="Logo SMP Negeri 3 Jayapura">
        </div>
      </div>
      <h1 class="hero-title">Pemilihan Ketua OSIS SMP Negeri 3 Jayapura Periode 2026/2027</h1>
      <div class="hero-badge">Saatnya Menentukan Pemimpin Baru OSIS Kita!</div>
    </section>

    <div class="action-stack">
      <!-- Tombol Aksi Atas -->
      <button type="button" class="btn-action btn-navy" onclick="smoothNavigate('pemilihan.html')">
        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 11l3 3L22 4"></path>
          <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
        </svg>
        <span>Masuk ke Bilik Pemilihan Suara</span>
      </button>

      <!-- Tombol Aksi Bawah -->
      <button type="button" class="btn-action btn-red" onclick="smoothNavigate('live-vote.html')">
        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="20" x2="18" y2="10"></line>
          <line x1="12" y1="20" x2="12" y2="4"></line>
          <line x1="6" y1="20" x2="6" y2="14"></line>
        </svg>
        <span>Live Vote Count</span>
      </button>
    </div>
  </main>

  <div class="poster-wave-bottom"></div>
  <script src="config.js"></script>
</body>
</html>
