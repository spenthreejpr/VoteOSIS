<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Terima Kasih - Suara Berhasil Direkam</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 24px;
    }

    .success-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      width: 100%;
      max-width: 680px;
      gap: 28px;
    }

    .check-circle {
      width: clamp(92px, 12vw, 130px);
      height: clamp(92px, 12vw, 130px);
      border-radius: 50%;
      background: var(--navy-primary);
      border: 6px solid var(--white);
      box-shadow: 0 14px 32px rgba(19, 56, 143, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: popIn 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .check-circle svg {
      width: 58%;
      height: 58%;
      color: var(--bg-yellow);
    }

    @keyframes popIn {
      0% { transform: scale(0.4); opacity: 0; }
      80% { transform: scale(1.08); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }

    .success-title {
      font-family: 'Montserrat', sans-serif;
      font-weight: 900;
      font-size: clamp(1.5rem, 3vw, 2.6rem);
      color: var(--navy-primary);
      text-transform: uppercase;
      text-shadow: 
        -2px -2px 0 var(--white),  
         2px -2px 0 var(--white),
        -2px  2px 0 var(--white),
         2px  2px 0 var(--white);
    }

    .btn-next-voter {
      width: 100%;
      max-width: 480px;
      padding: clamp(20px, 3vh, 28px) 32px;
      font-size: clamp(1.15rem, 1.8vw, 1.6rem);
      border-radius: 24px;
    }
  </style>
</head>
<body class="desktop-full-ratio">
  <div class="poster-wave-top"></div>

  <main class="success-wrap">
    <div class="check-circle">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
    </div>

    <h1 class="success-title">Terima Kasih! Suara Anda Telah Masuk</h1>

    <!-- 1 Tombol Aksi Sesuai Permintaan -->
    <button type="button" class="btn-action btn-navy btn-next-voter" onclick="smoothNavigate('pemilihan.html')">
      <span>Pemilih Suara Berikutnya</span>
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
        <line x1="5" y1="12" x2="19" y2="12"></line>
        <polyline points="12 5 19 12 12 19"></polyline>
      </svg>
    </button>
  </main>

  <div class="poster-wave-bottom"></div>
  <script src="config.js"></script>
</body>
</html>
